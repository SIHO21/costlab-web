# Render 정적 사이트 설정 (코스트랩 웹) — 이 파일이 저장소 맨 위에 있으면 Render 가 읽습니다.
# 웹은 메뉴별 .html 파일로 나오는데 Render 는 /sales 를 sales.html 로 자동 연결하지 않아서
# 주소마다 이어 주고, 나머지는 index.html 로 보냅니다(앱 안에서 화면을 고름).
services:
  - type: web
    runtime: static
    name: costlab-web
    buildCommand: ""
    staticPublishPath: .
    routes:
      - { type: rewrite, source: /sales, destination: /sales.html }
      - { type: rewrite, source: /shop, destination: /shop.html }
      - { type: rewrite, source: /breakeven, destination: /breakeven.html }
      - { type: rewrite, source: /explore, destination: /explore.html }
      - { type: rewrite, source: /link, destination: /link.html }
      - { type: rewrite, source: /*, destination: /index.html }
    headers:
      - { path: /_expo/*, name: Cache-Control, value: "public, max-age=31536000, immutable" }
      - { path: /*.html, name: Cache-Control, value: "no-cache" }
